<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback — LeafScan AI</title>
    <meta name="description" content="Share your feedback about LeafScan AI plant disease detection.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green-700: #15803d; --green-600: #16a34a; --green-400: #4ade80; --accent: #a3e635;
            --surface: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1);
            --text-primary: #f0fdf4; --text-secondary: #bbf7d0; --text-muted: #6ee7b7;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #020c05 0%, #052e16 40%, #0a3d1a 70%, #020c05 100%);
            min-height: 100vh; color: var(--text-primary);
        }
        .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12; }
        .orb-1 { width: 450px; height: 450px; background: #16a34a; top: 20%; left: -100px; }
        .orb-2 { width: 350px; height: 350px; background: #4ade80; bottom: 10%; right: -80px; }

        nav {
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(20px); background: rgba(5,46,22,0.7);
            border-bottom: 1px solid var(--border); padding: 0 2rem;
        }
        .nav-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; color: var(--text-primary); text-decoration: none; }
        .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, var(--green-600), var(--accent)); border-radius: 9px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 18px; height: 18px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-links { display: flex; gap: 6px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; padding: 7px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 500; transition: all 0.2s; }
        .nav-links a:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }

        .page-wrap { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 44px 2rem 80px; }

        .back-link { display: inline-flex; align-items: center; gap: 7px; color: var(--text-muted); text-decoration: none; font-size: 0.86rem; font-weight: 500; margin-bottom: 32px; transition: color 0.2s; }
        .back-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .back-link:hover { color: var(--green-400); }

        .page-header { text-align: center; margin-bottom: 36px; }
        .header-icon {
            width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 20px;
            background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.2);
            display: flex; align-items: center; justify-content: center;
        }
        .header-icon svg { width: 26px; height: 26px; stroke: var(--green-400); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
        .page-header h1 { font-size: 1.9rem; font-weight: 800; margin-bottom: 10px; }
        .page-header p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.65; }

        .form-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 22px; padding: 32px;
            backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        /* STAR RATING */
        .rating-section { margin-bottom: 26px; }
        .field-label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 10px; }
        .stars { display: flex; gap: 6px; }
        .star-btn {
            width: 36px; height: 36px; background: rgba(255,255,255,0.04);
            border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s ease;
        }
        .star-btn svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: all 0.18s; }
        .star-btn:hover svg, .star-btn.active svg { stroke: #fbbf24; fill: #fbbf24; }
        .star-btn.active { background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.3); }

        .form-group { margin-bottom: 18px; }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%; background: rgba(255,255,255,0.04);
            border: 1px solid var(--border); border-radius: 11px;
            color: var(--text-primary); font-family: 'Inter', sans-serif;
            font-size: 0.9rem; padding: 12px 14px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s; resize: vertical;
            appearance: none;
        }
        .form-group textarea { min-height: 110px; }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: rgba(74,222,128,0.45);
            box-shadow: 0 0 0 3px rgba(74,222,128,0.07);
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder { color: rgba(110,231,183,0.35); }
        .form-group select option { background: #052e16; }
        .optional { font-size: 0.72em; font-weight: 400; color: var(--text-muted); text-transform: none; letter-spacing: 0; }

        .char-count { font-size: 0.73rem; color: var(--text-muted); text-align: right; margin-top: 5px; }
        .char-count.warn { color: #fbbf24; }

        .divider { border: none; border-top: 1px solid var(--border); margin: 22px 0; }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--green-700), var(--green-600));
            color: white; font-size: 0.92rem; font-weight: 600;
            border: none; border-radius: 11px; padding: 14px;
            cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .submit-btn svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(34,197,94,0.28); }

        /* TOAST */
        .toast {
            position: fixed; bottom: 28px; right: 28px;
            background: linear-gradient(135deg, var(--green-700), var(--green-600));
            color: white; padding: 14px 22px; border-radius: 13px;
            font-size: 0.88rem; font-weight: 600;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transform: translateY(100px); opacity: 0;
            transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index: 999;
        }
        .toast svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
</div>

<nav>
    <div class="nav-inner">
        <a href="/" class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C9 2 5 5.5 5 10.5C5 15.5 8.1 21 12 22C15.9 21 19 15.5 19 10.5C19 5.5 15 2 12 2Z"/><line x1="12" y1="7" x2="12" y2="19"/><path d="M12 11L9.5 9.5M12 14.5L14.5 13"/></svg>
            </div>
            LeafScan AI
        </a>
        <div class="nav-links">
            <a href="/diseases">Disease Library</a>
            <a href="/">Home</a>
        </div>
    </div>
</nav>

<div class="page-wrap">
    <a href="/" class="back-link">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Home
    </a>

    <div class="page-header">
        <div class="header-icon">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </div>
        <h1>Share Your Feedback</h1>
        <p>Help us improve LeafScan AI. Your thoughts shape the future of this tool.</p>
    </div>

    <div class="form-card">
        <form id="feedback-form" action="/submit_feedback" method="POST">

            <div class="rating-section">
                <label class="field-label">Overall Experience</label>
                <div class="stars" id="stars">
                    <button type="button" class="star-btn" onclick="setRating(1)">
                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                    <button type="button" class="star-btn" onclick="setRating(2)">
                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                    <button type="button" class="star-btn" onclick="setRating(3)">
                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                    <button type="button" class="star-btn" onclick="setRating(4)">
                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                    <button type="button" class="star-btn" onclick="setRating(5)">
                        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </button>
                </div>
                <input type="hidden" name="rating" id="rating-input">
            </div>

            <div class="form-group">
                <label class="field-label" for="category">Feedback Type</label>
                <select name="category" id="category">
                    <option value="">Select a category...</option>
                    <option value="accuracy">Detection Accuracy</option>
                    <option value="ui">User Interface</option>
                    <option value="performance">Performance / Speed</option>
                    <option value="feature">Feature Request</option>
                    <option value="bug">Bug Report</option>
                    <option value="general">General Feedback</option>
                </select>
            </div>

            <hr class="divider">

            <div class="form-group">
                <label class="field-label" for="name">Your Name <span class="optional">(optional)</span></label>
                <input type="text" id="name" name="name" placeholder="e.g. Ravi Kumar">
            </div>

            <div class="form-group">
                <label class="field-label" for="email">Email Address <span class="optional">(optional)</span></label>
                <input type="email" id="email" name="email" placeholder="e.g. ravi@example.com">
            </div>

            <div class="form-group">
                <label class="field-label" for="feedback">Your Feedback <span style="color:#fca5a5">*</span></label>
                <textarea id="feedback" name="feedback" placeholder="Tell us what worked well, what could be improved, or any ideas you have..." required oninput="updateCount()"></textarea>
                <div class="char-count" id="char-count">0 / 500</div>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                Submit Feedback
            </button>
        </form>
    </div>
</div>

<div class="toast" id="toast">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    Thank you! Your feedback has been received.
</div>

<script>
    let rating = 0;
    function setRating(val) {
        rating = val;
        document.getElementById('rating-input').value = val;
        document.querySelectorAll('.star-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i < val);
        });
    }
    function updateCount() {
        const text = document.getElementById('feedback').value;
        const el = document.getElementById('char-count');
        el.textContent = `${text.length} / 500`;
        el.classList.toggle('warn', text.length > 400);
    }
    document.getElementById('feedback-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const feedback = document.getElementById('feedback').value.trim();
        if (feedback.length < 10) { alert('Please enter at least 10 characters.'); return; }
        const btn = document.getElementById('submit-btn');
        btn.innerHTML = 'Sending...';
        btn.disabled = true;
        setTimeout(() => {
            document.getElementById('feedback-form').reset();
            updateCount();
            rating = 0;
            document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
            btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:white;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Submit Feedback';
            btn.disabled = false;
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }, 800);
    });
</script>

</body>
</html>
